name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Check CalVer Tag
        run: |
          # Releases are tagged vYYYY.MM.MICRO with an unpadded month, e.g. v2026.11.0.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{4}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not CalVer vYYYY.MM.MICRO (e.g. v2026.11.0). Get the next tag from 'make next-version'."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web Admin UI
        run: |
          bun install --cwd ui
          make ui-build

      - name: Run Tests
        run: make test-go

      - name: Build Binaries
        run: |
          # Extract version from tag (e.g. refs/tags/v2026.11.0 -> v2026.11.0)
          VERSION=${GITHUB_REF#refs/tags/}
          
          # We want to cross-compile for macOS (darwin) and Linux, both amd64 and arm64
          PLATFORMS=("darwin/amd64" "darwin/arm64" "linux/amd64" "linux/arm64")
          
          mkdir -p dist
          
          for PLATFORM in "${PLATFORMS[@]}"; do
            IFS="/" read -r GOOS GOARCH <<< "$PLATFORM"
            
            echo "Building moul and moul-ctl for $GOOS/$GOARCH..."
            
            # Compile moul (server)
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w -X main.Version=$VERSION" \
              -o dist/moul \
              cmd/moul/main.go
              
            # Compile moul-ctl (management TUI)
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags="-s -w -X main.Version=$VERSION" \
              -o dist/moul-ctl \
              cmd/moul-ctl/main.go
              
            # Archive binaries to preserve execution bits
            tar -czf dist/moul_${VERSION}_${GOOS}_${GOARCH}.tar.gz -C dist moul
            tar -czf dist/moul-ctl_${VERSION}_${GOOS}_${GOARCH}.tar.gz -C dist moul-ctl
            
            # Clean temporary uncompressed binaries in dist
            rm dist/moul dist/moul-ctl
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
