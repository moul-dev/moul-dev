# Telegraf Configuration for mould System Monitoring
# Works on macOS (brew install telegraf) and Linux hosts.
# Streams host system metrics over Unix Domain Socket to /tmp/moul-telegraf.sock in JSON format.

[agent]
  interval = "2s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "2s"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

# Streams metrics to mould Unix Domain Socket listener
[[outputs.socket_writer]]
  address = "unix:///tmp/moul-telegraf.sock"
  data_format = "json"

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# Read metrics about CPU usage
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

# Read metrics about memory usage
[[inputs.mem]]

# Read metrics about disk usage by mount point
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# Read metrics about network interface usage
[[inputs.net]]

# Read metrics about system load & uptime
[[inputs.system]]
