  /api/settings:
    get:
      summary: Get Settings
      description: Returns all server settings (S3 config, Litestream, Rate Limiting, IPs, Email Delivery) as key-value pairs.
      tags:
        - Settings & System Config
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      responses:
        '200':
          description: Server settings loaded successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'
    patch:
      summary: Update Settings
      description: Modifies server settings and reloads runtime configurations (rate limits, allowed IPs, mailer providers) dynamically.
      tags:
        - Settings & System Config
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Map of settings key-value strings to update.
              example:
                email_enabled: "true"
                email_provider: "resend"
                email_from_address: "noreply@example.com"
                email_from_name: "Moul App"
                email_api_key: "re_123456789"
                email_domain: "mg.example.com"
                email_region: "us-east-1"
                email_endpoint: "https://api.resend.com/emails"
                file_s3_enabled: "true"
                file_s3_bucket: "my-uploads-bucket"
                rate_limiting_enabled: "true"
      responses:
        '200':
          description: Settings updated successfully, returns full settings map.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '400':
          description: Invalid request payload.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/upload:
    get:
      summary: List Uploaded Files
      description: Returns a list of all stored files and their metadata (including thumbnail maps and thumbhashes), sorted newest first.
      tags:
        - File Storage
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      responses:
        '200':
          description: List of stored files.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
        '401':
          description: Authorization failed (requires either a valid authenticated user or admin key).
        '500':
          $ref: '#/components/responses/500InternalError'
    post:
      summary: Upload File
      description: Uploads a media file. Automatically processes images to extract thumbhashes and generate semantic sizes (sm, md, lg).
      tags:
        - File Storage
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File binary payload.
      responses:
        '200':
          description: File uploaded successfully. Returns a list containing the file metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
        '400':
          description: Missing file in multipart form-data.
        '401':
          description: Authorization failed (requires either a valid authenticated user or admin key).
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/upload/{path}:
    delete:
      summary: Delete Uploaded File
      description: Deletes an uploaded file and all associated thumbnails and metadata by file ID or path.
      tags:
        - File Storage
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - name: path
          in: path
          required: true
          description: File ID (e.g. `abc123xyz`) or key/path to delete.
          schema:
            type: string
      responses:
        '200':
          description: File deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: string
        '400':
          description: Missing or invalid file identifier.
        '401':
          description: Authorization failed.
        '404':
          description: File not found.
        '500':
          $ref: '#/components/responses/500InternalError'


  /api/moul/{name}/auth-with-password:
    post:
      summary: Password Authentication
      description: |
        Authenticates identity (username or email) against the designated auth moul collection and yields an authentication token.
        Note: New user signup for password authentication is performed by creating a record in the auth collection via `POST /api/moul/{name}/records` with `username`, `email`, `password`, and `passwordConfirm`.
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identity
                - password
              properties:
                identity:
                  type: string
                  description: Email or username.
                  example: "user@example.com"
                password:
                  type: string
                  description: Plain text password.
                  example: "Password123"
            example:
              identity: "user@example.com"
              password: "Password123"
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials or collection is not an auth collection.
        '404':
          description: Not found.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/request-password-reset:
    post:
      summary: Request Password Reset
      description: Generates a password reset token for the specified user email and sends a reset link using the collection's Password Reset email template.
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Registered email address.
                  example: "user@example.com"
      responses:
        '200':
          description: Password reset link dispatched if email exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "If the email exists, a password reset link has been sent."
        '400':
          description: Missing email or invalid collection type.
        '404':
          description: Not found.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/confirm-password-reset:
    post:
      summary: Confirm Password Reset
      description: Resets user password using a valid, unexpired reset token.
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  description: Password reset token received via email.
                password:
                  type: string
                  description: New password.
                  example: "NewPassword123"
                passwordConfirm:
                  type: string
                  description: Optional confirmation matching new password.
                  example: "NewPassword123"
      responses:
        '200':
          description: Password successfully reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset successfully"
        '400':
          description: Invalid/expired token or password complexity validation error.
        '404':
          description: Not found.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/refresh:
    post:
      summary: Refresh JWT Token
      description: Issues a fresh JWT token for an active authentication session, revoking the previous JWT token.
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized or revoked token.
        '404':
          description: Not found.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/logout:
    post:
      summary: User Logout
      description: Revokes the current Bearer JWT token, preventing it from being used for future authenticated requests.
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"
        '400':
          description: Missing or malformed Authorization header.
        '404':
          description: Not found.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/otp/request:
    post:
      summary: Request OTP
      description: |
        Generates a 6-digit Email OTP valid for 10 minutes and outputs it to the server console.
        If the email is not registered yet, an account is automatically created (Auto-Signup).
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
            example:
              email: "user@example.com"
      responses:
        '200':
          description: OTP code generated and printed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: OTP generated and sent successfully (check server logs/console for code)
        '400':
          description: Invalid input or invalid collection.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/auth-with-otp:
    post:
      summary: Verify OTP / Authenticate
      description: Verifies OTP code sent to user email and returns an authentication token on success.
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                code:
                  type: string
                  description: 6-digit numeric OTP code.
                  example: "123456"
            example:
              email: "user@example.com"
              code: "123456"
      responses:
        '200':
          description: Verification successful, token generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid OTP, expired OTP, or input errors.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/passkey/register/options:
    post:
      summary: Request Passkey Registration Options
      description: Retrieves WebAuthn credential creation options for an authenticated user to register a new passkey.
      tags:
        - User Authentication
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      responses:
        '200':
          description: Registration options returned with session token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken:
                    type: string
                    description: Temporary token to link options verification.
                  options:
                    type: object
                    description: WebAuthn registration options wrapper.
                    properties:
                      publicKey:
                        type: object
                        description: Standard WebAuthn CredentialCreationOptions payload.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/passkey/register/verify:
    post:
      summary: Verify Passkey Registration
      description: Verifies client navigator assertion credentials response and completes credential registration.
      tags:
        - User Authentication
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: sessionToken
          in: query
          required: false
          description: The session token returned by options endpoint (can also be passed via X-Session-Token header).
          schema:
            type: string
        - name: X-Session-Token
          in: header
          required: false
          description: Alternative header to pass the session token.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw navigator.credentials.create() response object.
      responses:
        '200':
          description: Passkey registered successfully.
        '400':
          description: Invalid credential verification payload.
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/moul/{name}/passkey/signup/options:
    post:
      summary: Request Passkey Signup Options
      description: Returns credential creation options for registering a brand-new user via WebAuthn.
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: "newuser@example.com"
            example:
              email: "newuser@example.com"
      responses:
        '200':
          description: Options and session token payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken:
                    type: string
                  options:
                    type: object
                    description: WebAuthn signup options wrapper.
                    properties:
                      publicKey:
                        type: object

  /api/moul/{name}/passkey/signup/verify:
    post:
      summary: Verify Passkey Signup
      description: Confirms client WebAuthn registration, auto-creates user record, and logs them in.
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: sessionToken
          in: query
          required: false
          description: The session token returned by options endpoint (can also be passed via X-Session-Token header).
          schema:
            type: string
        - name: X-Session-Token
          in: header
          required: false
          description: Alternative header to pass the session token.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Account created and logged in successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/moul/{name}/passkey/login/options:
    post:
      summary: Request Passkey Login Options
      description: Returns credential assertion options to challenge an existing user's registered WebAuthn key.
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identity
              properties:
                identity:
                  type: string
                  description: Email or Username of the user.
                  example: "user@example.com"
            example:
              identity: "user@example.com"
      responses:
        '200':
          description: Login request options payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken:
                    type: string
                  options:
                    type: object
                    description: WebAuthn login options wrapper.
                    properties:
                      publicKey:
                        type: object

  /api/moul/{name}/passkey/login/verify:
    post:
      summary: Verify Passkey Login
      description: Validates user assertion authentication, logging them in.
      tags:
        - User Authentication
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: sessionToken
          in: query
          required: false
          description: The session token returned by options endpoint (can also be passed via X-Session-Token header).
          schema:
            type: string
        - name: X-Session-Token
          in: header
          required: false
          description: Alternative header to pass the session token.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Successfully authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/oauth2/device/authorize:
    post:
      summary: OAuth2 Device Authorization Endpoint
      description: Initiates device authorization code flow and returns code challenges.
      tags:
        - OAuth2 Device Flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_id
              properties:
                client_id:
                  type: string
                scope:
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
              properties:
                client_id:
                  type: string
                scope:
                  type: string
      responses:
        '200':
          description: Verification codes generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                  verification_uri:
                    type: string
                  verification_uri_complete:
                    type: string
                  expires_in:
                    type: integer
                  interval:
                    type: integer

  /api/oauth2/device/token:
    post:
      summary: OAuth2 Device Token Request
      description: Polling endpoint for client devices to acquire access token after authorization.
      tags:
        - OAuth2 Device Flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - grant_type
                - device_code
                - client_id
              properties:
                grant_type:
                  type: string
                  example: urn:ietf:params:oauth:grant-type:device_code
                device_code:
                  type: string
                client_id:
                  type: string
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - device_code
                - client_id
              properties:
                grant_type:
                  type: string
                  example: urn:ietf:params:oauth:grant-type:device_code
                device_code:
                  type: string
                client_id:
                  type: string
      responses:
        '200':
          description: Device verified. Access token returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
        '400':
          description: Token flow errors (pending approval, expired, etc.).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [unsupported_grant_type, invalid_request, expired_token, authorization_pending]

  /device:
    get:
      summary: Render Device Verification Page
      description: Returns the HTML interactive form where users enter user_codes.
      tags:
        - OAuth2 Device Flow
      parameters:
        - name: user_code
          in: query
          required: false
          schema:
            type: string
        - name: auth_moul
          in: query
          required: false
          description: Collection for device auth (defaults to _rootUsers; device flow is restricted to root account).
          schema:
            type: string
      responses:
        '200':
          description: Verification form HTML page.
          content:
            text/html:
              schema:
                type: string

  /device/verify:
    post:
      summary: Verify Device Flow Request
      description: Processes verification form input, checking root user credentials, and marks the code as approved.
      tags:
        - OAuth2 Device Flow
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - user_code
                - identity
                - password
              properties:
                user_code:
                  type: string
                identity:
                  type: string
                password:
                  type: string
                auth_moul:
                  type: string
                  description: Collection for device auth (defaults to _rootUsers; device flow is restricted to root account).
      responses:
        '200':
          description: Returns HTML verification success/failure page.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Bad request, user validation failed.

  /api/moul/{name}/records:
    get:
      summary: List Records
      description: Queries the collection records. Query filters are applied dynamically based on collection HCL listRule config.
      tags:
        - Dynamic Records CRUD
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: expand
          in: query
          required: false
          description: Comma-separated relational fields to expand inline.
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: Cursor record ID to fetch items after for cursor-based pagination.
          schema:
            type: string
      responses:
        '200':
          description: List of records matching listRule constraints.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          description: Rule evaluation error or bad request.
        '404':
          description: Not found.
        '500':
          $ref: '#/components/responses/500InternalError'
    post:
      summary: Create Record
      description: |
        Creates a new record. Evaluates `createRule` against the auth context first.
        - **Auth Moul**: Creating a record signs up a new user when `username`, `email`, `password`, and `passwordConfirm` are provided. Passwords are validated for complexity and securely hashed into `passwordHash`.
        - **Worker Moul**: Creating a record enqueues a background job and wakes the worker thread.
        - **Analytic Moul**: Creating a record tracking an event; resolves browser, OS, GeoIP, and cookie sessions.
      tags:
        - Dynamic Records CRUD
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: expand
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Dynamic fields mapping matching the collection schema.
              additionalProperties: true
            example:
              username: "johndoe"
              email: "john@example.com"
              password: "Password123"
              passwordConfirm: "Password123"
      responses:
        '201':
          description: Record created successfully. Returns the populated row.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Validation errors or unique key constraint failure.
        '401':
          description: Authentication required by collection rules.
        '403':
          description: Forbidden by collection rules.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/records/{id}:
    get:
      summary: Get Record
      description: Retrieves a single record by ID, restricted by `viewRule` constraints.
      tags:
        - Dynamic Records CRUD
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: expand
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Record found.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Rule evaluation error.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Record or Not found.
        '500':
          $ref: '#/components/responses/500InternalError'
    patch:
      summary: Update Record
      description: Updates record fields, validated by `updateRule` constraints.
      tags:
        - Dynamic Records CRUD
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: expand
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Record updated successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Input formatting error.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Record or Not found.
        '500':
          $ref: '#/components/responses/500InternalError'
    delete:
      summary: Delete Record
      description: Deletes record by ID, validated by `deleteRule` constraints.
      tags:
        - Dynamic Records CRUD
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Record deleted successfully.
        '400':
          description: Rule evaluation error.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Record not found.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/subscribe:
    get:
      summary: Subscribe to Real-time Record Changes (SSE)
      description: |
        Establishes a Server-Sent Events (SSE) stream for real-time record creations, updates, and deletions on the target collection.
        Governed by `subscribeRule` (or fallback to `listRule`).
      tags:
        - Dynamic Records CRUD
        - Realtime Subscriptions
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: event
          in: query
          required: false
          description: Comma-separated list of event actions to filter (create, update, delete, *)
          schema:
            type: string
            default: "*"
        - name: id
          in: query
          required: false
          description: Filter events for a single record ID
          schema:
            type: string
        - name: token
          in: query
          required: false
          description: JWT Auth Token for browser SSE clients
          schema:
            type: string
      responses:
        '200':
          description: Real-time SSE event stream opened.
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: Collection not found.

