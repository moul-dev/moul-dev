  /api/mcp:
    get:
      summary: MCP SSE Stream Endpoint (Legacy & Streamable HTTP)
      description: |
        Establishes a persistent Server-Sent Events (SSE) stream for Model Context Protocol (MCP) communication.

        AI tools connect to this endpoint to receive continuous JSON-RPC event updates and session message routing endpoints (`/api/mcp/message?sessionId=...`).
        
        Requires master key authentication via:
        - Header `X-Admin-Key: <MOUL_ADMIN_KEY>`
        - Header `Authorization: Bearer <MOUL_ADMIN_KEY>`
        - Query parameter `?adminKey=<MOUL_ADMIN_KEY>` (or `?token=...`, `?api_key=...`)
      tags:
        - Model Context Protocol (MCP)
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - in: query
          name: adminKey
          required: false
          schema:
            type: string
          description: Master admin key passed in URL query parameter.
      responses:
        '200':
          description: SSE event stream connection established.
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: endpoint\ndata: /api/mcp/message?sessionId=12345\n\n"
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          description: MCP server not initialized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
    post:
      summary: MCP Streamable HTTP JSON-RPC Endpoint (MCP 2025 Spec)
      description: |
        Direct JSON-RPC 2.0 endpoint for client requests (e.g. `initialize`, `tools/list`, `tools/call`).

        Supports both standard Streamable HTTP transport and message routing for active sessions.
      tags:
        - Model Context Protocol (MCP)
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - in: query
          name: adminKey
          required: false
          schema:
            type: string
          description: Master admin key.
        - in: query
          name: sessionId
          required: false
          schema:
            type: string
          description: Optional active session ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - method
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: integer
                  example: 1
                method:
                  type: string
                  example: "initialize"
                params:
                  type: object
                  example:
                    protocolVersion: "2024-11-05"
                    capabilities: {}
                    clientInfo:
                      name: "antigravity"
                      version: "1.0"
      responses:
        '200':
          description: JSON-RPC response returned successfully.
        '202':
          description: Request accepted for asynchronous processing.
        '400':
          description: Invalid JSON-RPC payload or session ID.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '503':
          description: MCP server not initialized.
    delete:
      summary: Terminate MCP Session Endpoint
      description: |
        Terminates an active Streamable HTTP or SSE session ID and cleans up associated resources.
      tags:
        - Model Context Protocol (MCP)
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - in: query
          name: sessionId
          required: true
          schema:
            type: string
          description: Session ID to disconnect and terminate.
      responses:
        '200':
          description: Session terminated successfully.
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/mcp/message:
    post:
      summary: MCP SSE Message Routing Endpoint (Legacy SSE Spec)
      description: |
        Endpoint for sending JSON-RPC 2.0 requests to an active MCP session created via `/api/mcp`.

        Supports standard MCP methods including tool discovery (`tools/list`), tool invocation (`tools/call`), resource listing (`resources/list`), and prompt listing (`prompts/list`).
      tags:
        - Model Context Protocol (MCP)
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - in: query
          name: sessionId
          required: false
          schema:
            type: string
          description: Active MCP SSE session ID returned during connection handshake.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jsonrpc
                - method
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: integer
                  example: 1
                method:
                  type: string
                  example: "tools/call"
                params:
                  type: object
                  example:
                    name: "moul_list_collections"
                    arguments: {}
      responses:
        '200':
          description: Message processed successfully.
        '202':
          description: Message accepted by active SSE session.
        '400':
          description: Invalid JSON-RPC request syntax or missing session ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

components:
  securitySchemes:
    AdminKeyAuth:
      type: apiKey
      in: header
      name: X-Admin-Key
      description: Shared API Key authentication for administration actions.
    BearerAuth:
      type: http
      scheme: bearer
      description: User bearer token for authentication.
  responses:
    401Unauthorized:
      description: Authentication required or invalid key provided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
    500InternalError:
      description: Database error or internal processing server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HTTPError'
  schemas:
    HTTPError:
      type: object
      properties:
        message:
          type: string
          example: Authentication required
    MoulField:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
          enum: [text, number, bool, date, datetime, json, url, file, select, relation]
        relationConfig:
          type: object
          properties:
            targetMoul:
              type: string
              description: Target collection name referenced.
            cardinality:
              type: string
              enum: ["1:1", "1:N", "M:N"]
              description: >
                Relationship cardinality. "1:1" and "1:N" store a single target record ID string.
                "M:N" stores a JSON array of target record ID strings (e.g. ["id1", "id2"]) in a single TEXT column
                (no separate physical SQL junction table is created; queries use SQLite json_each subqueries).
            onDelete:
              type: string
              enum: ["CASCADE", "SET_NULL", "RESTRICT"]
              description: Action to take when a referenced target record is deleted.
    MoulRules:
      type: object
      properties:
        listRule:
          type: string
          description: Expression to authorize listing records (e.g. `@request.auth.id != ""`).
        viewRule:
          type: string
          description: Expression to authorize viewing a single record.
        createRule:
          type: string
          description: Expression to authorize record creation.
        updateRule:
          type: string
          description: Expression to authorize record updates.
        deleteRule:
          type: string
          description: Expression to authorize record deletion.
    EmailTemplate:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
    EmailTemplates:
      type: object
      properties:
        verification:
          $ref: '#/components/schemas/EmailTemplate'
        password_reset:
          $ref: '#/components/schemas/EmailTemplate'
        confirm_email_change:
          $ref: '#/components/schemas/EmailTemplate'
        otp:
          $ref: '#/components/schemas/EmailTemplate'
        login_alert:
          $ref: '#/components/schemas/EmailTemplate'
    EmailConfig:
      type: object
      description: Server settings for multi-provider transactional email delivery.
      properties:
        email_enabled:
          type: string
          enum: ["true", "false"]
          description: Master switch to enable or disable actual email dispatch.
        email_provider:
          type: string
          enum: [console, ses, resend, mailgun, sendgrid, cloudflare]
          description: Active email delivery service driver.
        email_from_address:
          type: string
          description: Default sender email address (e.g. `noreply@example.com`).
        email_from_name:
          type: string
          description: Default sender display name (e.g. `Moul App`).
        email_api_key:
          type: string
          description: API key or AWS Access Key ID.
        email_api_secret:
          type: string
          description: API secret or AWS Secret Access Key.
        email_domain:
          type: string
          description: Domain name (for Mailgun) or Account ID (for Cloudflare).
        email_region:
          type: string
          description: Region identifier (e.g. `us-east-1` for AWS SES or `us`/`eu` for Mailgun).
        email_endpoint:
          type: string
          description: Custom API endpoint URL or Cloudflare Worker endpoint URL.
    Moul:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [base, auth, worker, analytic]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/MoulField'
        rules:
          $ref: '#/components/schemas/MoulRules'
        email_templates:
          $ref: '#/components/schemas/EmailTemplates'
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Webhook:
      type: object
      required:
        - url
      properties:
        id:
          type: string
          description: Unique webhook identifier.
        url:
          type: string
          description: Target HTTP URL for webhook dispatch.
        events:
          type: array
          items:
            type: string
          description: Event triggers (`create:before`, `create:after`, `update:before`, `update:after`, `delete:before`, `delete:after`, `*`).
        secret:
          type: string
          description: Optional HMAC-SHA256 secret key.
        enabled:
          type: boolean
          description: Whether the webhook is enabled.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FileInfo:
      type: object
      properties:
        id:
          type: string
          description: Unique file identifier prefix.
        filename:
          type: string
        url:
          type: string
        thumbhash:
          type: string
        thumbs:
          type: object
          additionalProperties:
            type: string
          description: Thumbnail resolutions dictionary mapping sizes (sm, md, lg) to URLs.
        size:
          type: integer
          format: int64
          description: File size in bytes.
        created_at:
          type: string
          format: date-time
          description: Upload timestamp.

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Authentication token.
        record:
          type: object
          description: Populated fields of the authenticated user record.
          properties:
            id:
              type: string
            created_at:
              type: string
            updated_at:
              type: string
            username:
              type: string
            email:
              type: string
          additionalProperties: true
    Visit:
      type: object
      properties:
        id:
          type: string
        visitor_token:
          type: string
        user_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        referrer:
          type: string
        referring_domain:
          type: string
        landing_page:
          type: string
        browser:
          type: string
        os:
          type: string
        device_type:
          type: string
        country:
          type: string
        region:
          type: string
        city:
          type: string
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_term:
          type: string
        utm_content:
          type: string
        utm_campaign:
          type: string
        started_at:
          type: string
          format: date-time
    RequestLog:
      type: object
      properties:
        id:
          type: string
        visit_id:
          type: string
        method:
          type: string
        path:
          type: string
        status_code:
          type: integer
        response_time_ms:
          type: integer
        created_at:
          type: string
          format: date-time
    FeatureFlag:
