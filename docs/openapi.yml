openapi: 3.0.3
info:
  title: Moul API Reference
  version: dev
  description: |
    `mould` is a lightweight, self-contained dynamic database, authentication, and background job processing engine in Go, inspired by PocketBase and Elixir's Oban.

    ### Authentication and Authorization
    - **Admin Endpoints**: Protected by `X-Admin-Key` header API authentication.
    - **User Endpoints**: Protected by Bearer tokens (`Authorization: Bearer <token>`) generated upon successful user authentication.
    - **Dynamic Record Operations**: Checked at runtime by the HCL-like expression rules defined on the parent collection (e.g. `createRule`, `listRule`).

    ### Supported Authentication & Signup Flows
    - **Password Flow**:
      - **Signup**: Create a record in an `auth` collection via `POST /api/moul/{name}/records` with `username`, `email`, `password`, and `passwordConfirm`. Passwords are validated for complexity and automatically hashed.
      - **Login**: `POST /api/moul/{name}/auth-with-password` with `identity` (username or email) and `password`.
      - **Password Reset**: Request reset via `POST /api/moul/{name}/request-password-reset` and confirm reset with token via `POST /api/moul/{name}/confirm-password-reset`.
    - **Session & Token Management**:
      - **Refresh**: Issue a fresh JWT token using `POST /api/moul/{name}/refresh`.
      - **Logout**: Revoke current JWT token using `POST /api/moul/{name}/logout`.
    - **Email OTP Flow**:
      - **Signup & Login**: `POST /api/moul/{name}/otp/request` sends a 6-digit OTP code to the email (automatically creating a new user record if the email does not exist yet). Verify code with `POST /api/moul/{name}/auth-with-otp`.
    - **Passkey (WebAuthn) Flow**:
      - **Signup**: `POST /api/moul/{name}/passkey/signup/options` and `POST /api/moul/{name}/passkey/signup/verify`.
      - **Login**: `POST /api/moul/{name}/passkey/login/options` and `POST /api/moul/{name}/passkey/login/verify`.
      - **Register Existing User**: `POST /api/moul/{name}/passkey/register/options` and `POST /api/moul/{name}/passkey/register/verify`.

    ### Supported Email Delivery Providers
    - **Amazon SES**: AWS SES v2 REST API integration with automatic SigV4 signing.
    - **Resend**: Modern developer email delivery API.
    - **Mailgun**: Transactional email API supporting US & EU regions.
    - **SendGrid**: Transactional Mail Send API v3.
    - **Cloudflare Email Sending**: Cloudflare Email REST API and Worker HTTP endpoints.
    - **Console**: Local development fallback logging emails directly to the server console.

    ### Programmatic Go API & Extensibility
    - **Server Embedding**: Embed the full server engine in Go apps via `pkg/app`.
    - **Custom HTTP Route Hooks**: Add custom endpoints using `RegisterRoute` or attach to the raw Echo router via `OnRouterInit`.
    - **Lifecycle Callbacks**: Run custom initialization logic after database setup using `OnBeforeStart`.
    - **Custom Background Workers**: Register custom job handlers using `RegisterWorker` and `RegisterPeriodicWorker`.

    ### Built-in Model Context Protocol (MCP) Server
    - **Overview**: `mould` includes a native Model Context Protocol (MCP) server powered by `github.com/mark3labs/mcp-go`. This allows AI coding assistants (Claude Desktop, Cursor, Windsurf, Antigravity) to inspect schema definitions, execute record CRUD, track background jobs, manage feature flags, and monitor host system metrics.
    - **Transport Modes**:
      - **Stdio Transport Mode**: Executed via `mould mcp`. Communicates directly over standard input/output streams. Ideal for local IDE configuration without running a public HTTP daemon.
      - **Streamable HTTP Transport Mode (MCP 2025 Spec)**: Served at `http://localhost:8090/api/mcp`. Natively accepts direct JSON-RPC POST requests, SSE stream GET requests, and DELETE session termination requests.
      - **HTTP SSE Transport Mode (Legacy Spec)**: Served at `http://localhost:8090/api/mcp` (with client POST messages directed to `/api/mcp/message`).
    - **Authentication Options**:
      - Header: `X-Admin-Key: <MOUL_ADMIN_KEY>`
      - Header: `Authorization: Bearer <MOUL_ADMIN_KEY>`
      - URL Query Parameter: `http://localhost:8090/api/mcp?adminKey=<MOUL_ADMIN_KEY>`
    - **Client Setup & Configuration Examples**:
      - **Claude Desktop Setup**:
        - Config Path (macOS): `~/Library/Application Support/Claude/claude_desktop_config.json`
        - Config Path (Windows): `%APPDATA%\Claude\claude_desktop_config.json`
        - *Stdio Mode*:
          ```json
          {
            "mcpServers": {
              "mould": {
                "command": "/usr/local/bin/mould",
                "args": ["mcp"],
                "env": {
                  "MOUL_DB_PATH": "./moul-local.db"
                }
              }
            }
          }
          ```
        - *Streamable HTTP / SSE Mode (Header Auth)*:
          ```json
          {
            "mcpServers": {
              "mould-sse": {
                "url": "http://localhost:8090/api/mcp",
                "headers": {
                  "X-Admin-Key": "<MOUL_ADMIN_KEY>"
                }
              }
            }
          }
          ```
        - *Streamable HTTP / SSE Mode (Query Param Auth)*:
          ```json
          {
            "mcpServers": {
              "mould-sse": {
                "url": "http://localhost:8090/api/mcp?adminKey=<MOUL_ADMIN_KEY>"
              }
            }
          }
          ```
      - **Cursor / VS Code / Windsurf / Antigravity Setup**:
        - Workspace Config: `.cursor/mcp.json` or `.vscode/mcp.json`
        - *Configuration*:
          ```json
          {
            "mcpServers": {
              "mould": {
                "command": "mould",
                "args": ["mcp"]
              }
            }
          }
          ```
      - **cURL Streamable HTTP Execution Example**:
        - *1. Direct POST JSON-RPC Request*:
          ```bash
          curl -X POST "http://localhost:8090/api/mcp" \
            -H "X-Admin-Key: <MOUL_ADMIN_KEY>" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2024-11-05", "capabilities": {}, "clientInfo": {"name": "curl", "version": "1.0"}}}'
          ```
        - *2. Query Param Auth Example*:
          ```bash
          curl -X POST "http://localhost:8090/api/mcp?adminKey=<MOUL_ADMIN_KEY>" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc": "2.0", "id": 1, "method": "tools/call", "params": {"name": "moul_list_collections", "arguments": {}}}'
          ```
    - **Built-in MCP Tools Summary (17 Native Tools)**:
      - **Collections**: `moul_list_collections`, `moul_get_collection`, `moul_create_collection`, `moul_delete_collection`
      - **Records CRUD**: `moul_list_records`, `moul_get_record`, `moul_create_record`, `moul_update_record`, `moul_delete_record`
      - **Worker Queues**: `moul_list_worker_jobs`, `moul_enqueue_job`, `moul_cancel_job`
      - **Feature Flags**: `moul_list_feature_flags`, `moul_set_feature_flag`
      - **System & Observability**: `moul_get_system_metrics`, `moul_get_analytics_summary`, `moul_list_requests`
servers:
  - url: http://localhost:8090
    description: Local development server
tags:
  - name: Setup Management
    description: Endpoints for checking setup status and registering initial root admin users.
  - name: Moul Schema Management
    description: Endpoints for creating, listing, inspecting, updating, and deleting collection schemas and HCL rules.
  - name: User Authentication
    description: |
      Complete end-user authentication and registration endpoints supporting three auth strategies:
      - **Password Auth**:
        - **Signup**: Submit `username`, `email`, `password`, and `passwordConfirm` via `POST /api/moul/{name}/records`.
        - **Login**: Authenticate with `identity` and `password` via `POST /api/moul/{name}/auth-with-password`.
        - **Password Reset**: Request reset (`POST /api/moul/{name}/request-password-reset`) and confirm reset (`POST /api/moul/{name}/confirm-password-reset`).
      - **Token Refresh & Logout**:
        - **Refresh**: Refresh JWT token (`POST /api/moul/{name}/refresh`).
        - **Logout**: Revoke current JWT token (`POST /api/moul/{name}/logout`).
      - **Email OTP**:
        - **Signup & Login**: Request OTP via `POST /api/moul/{name}/otp/request` (auto-registers new emails). Verify with `POST /api/moul/{name}/auth-with-otp`.
      - **Passkey (WebAuthn)**:
        - **Signup**: Request options (`POST /api/moul/{name}/passkey/signup/options`) and verify assertion (`POST /api/moul/{name}/passkey/signup/verify`).
        - **Login**: Request options (`POST /api/moul/{name}/passkey/login/options`) and verify assertion (`POST /api/moul/{name}/passkey/login/verify`).
        - **Register Key**: Authenticated users add keys via `/passkey/register/options` and `/passkey/register/verify`.
  - name: Dynamic Records CRUD
    description: Dynamic record operations (Create, List, Get, Update, Delete) governed by collection HCL rules.
  - name: OAuth2 Device Flow
    description: OAuth2 Device Authorization Grant flow for CLI, terminal apps, and constrained devices.
  - name: Admin Email Templates Management
    description: Admin endpoints to customize transactional email templates (OTP, Password Reset, Verification).
  - name: Admin Settings Management
    description: Admin endpoints for global server settings configuration.
  - name: File Storage
    description: File upload handler endpoint supporting multipart storage uploads.
  - name: Analytics & Request Observability
    description: Administrative and tracking endpoints for HTTP requests and site visit analytics.
  - name: Model Context Protocol (MCP)
    description: |
      Native Model Context Protocol (MCP) server endpoints allowing AI agents (Claude Desktop, Cursor, Antigravity) to interact with `mould`.

      #### Connection Modes & Setup
      1. **Stdio Transport (`mould mcp`)**: Standard I/O bridge mode for local AI clients.
      2. **HTTP SSE Transport (`/api/mcp`)**: Server-Sent Events stream endpoint for network-based AI clients.

      #### Authentication
      HTTP SSE requests require master key authentication:
      - Header `X-Admin-Key: <MOUL_ADMIN_KEY>` or `Authorization: Bearer <MOUL_ADMIN_KEY>`.

      #### Configuration Examples
      - **Claude Desktop** (`claude_desktop_config.json`):
        ```json
        {
          "mcpServers": {
            "mould": {
              "command": "/usr/local/bin/mould",
              "args": ["mcp"],
              "env": { "MOUL_DB_PATH": "./moul-local.db" }
            },
            "mould-sse": {
              "url": "http://localhost:8090/api/mcp",
              "headers": { "X-Admin-Key": "<MOUL_ADMIN_KEY>" }
            }
          }
        }
        ```
      - **Cursor IDE** (`.cursor/mcp.json`):
        ```json
        {
          "mcpServers": {
            "mould": { "command": "mould", "args": ["mcp"] }
          }
        }
        ```

      #### Available MCP Tools (17 Tools)
      - `moul_list_collections`: List all dynamic database collections.
      - `moul_get_collection`: View collection definition and rules.
      - `moul_create_collection`: Register a new collection schema (base, auth, worker, analytic).
      - `moul_delete_collection`: Drop collection table and remove schema.
      - `moul_list_records`: List records with field filtering and limits.
      - `moul_get_record`: Fetch single record by ID.
      - `moul_create_record`: Create record in collection.
      - `moul_update_record`: Update record by ID.
      - `moul_delete_record`: Delete record by ID.
      - `moul_list_worker_jobs`: List background jobs from worker table by state.
      - `moul_enqueue_job`: Enqueue job with handler, args_json, and priority.
      - `moul_cancel_job`: Cancel worker job.
      - `moul_list_feature_flags`: List OpenFeature flags.
      - `moul_set_feature_flag`: Create/update feature flag.
      - `moul_get_system_metrics`: Query host CPU, RAM, Disk, Load metrics.
      - `moul_get_analytics_summary`: Get visit count and request metrics.
      - `moul_list_requests`: Query HTTP request telemetry log.

paths:
  /api/setup:
    get:
      summary: Check Setup Status
      description: Returns whether a root user has been set up in the system.
      tags:
        - Setup Management
      security:
        - AdminKeyAuth: []
      responses:
        '200':
          description: Setup status checked successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  needsSetup:
                    type: boolean
                    description: True if no root users exist in the database.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'
    post:
      summary: Register Root User
      description: Sets up the initial root user for the application if none exist.
      tags:
        - Setup Management
      security:
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  minLength: 1
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Root user created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Root user created successfully
                  id:
                    type: string
                    example: usr-ABC123xyz
        '400':
          description: Bad request (validation failed or root user already complete).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/admin/login:
    post:
      summary: Admin Login
      description: Authenticates a root user with credentials and Master Admin Key to return a JWT token.
      tags:
        - Setup Management
      security:
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identity
                - password
              properties:
                identity:
                  type: string
                  description: Root user username or email.
                  example: root
                password:
                  type: string
                  description: Root user password.
                  example: AdminPassword123
      responses:
        '200':
          description: Successfully authenticated as root user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/admin/password:
    post:
      summary: Update Root User Password
      description: Updates the password of a root user. Requires valid Master Admin Key and verification of the user's current password.
      tags:
        - Setup Management
      security:
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - password
                - passwordConfirm
              properties:
                currentPassword:
                  type: string
                  description: Existing root user password.
                  example: OldPassword123
                password:
                  type: string
                  description: New root user password (minimum 8 characters, 1 uppercase, 1 lowercase, 1 digit).
                  example: NewPassword123
                passwordConfirm:
                  type: string
                  description: Confirmation of the new root password (must match password).
                  example: NewPassword123
                identity:
                  type: string
                  description: Optional username or email to target a specific root user.
                  example: root
      responses:
        '200':
          description: Root password updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Root password updated successfully
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul:
    get:
      summary: List Moul
      description: Lists the metadata schemas of all registered collections.
      tags:
        - Moul Schema Management
      responses:
        '200':
          description: List of registered moul.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Moul'
        '500':
          $ref: '#/components/responses/500InternalError'
    post:
      summary: Create Moul
      description: Creates a new database table and saves its schema metadata definition.
      tags:
        - Moul Schema Management
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                id:
                  type: string
                  description: Unique ID of the collection (auto-generated if omitted).
                name:
                  type: string
                  description: Unique name of the collection (must start with letter and contain only alphanumeric/underscores).
                type:
                  type: string
                  enum: [base, auth, worker, analytic]
                  default: base
                fields:
                  type: array
                  items:
                    $ref: '#/components/schemas/MoulField'
                rules:
                  $ref: '#/components/schemas/MoulRules'
                email_templates:
                  $ref: '#/components/schemas/EmailTemplates'
      responses:
        '201':
          description: Moul schema created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moul'
        '400':
          description: Invalid request parameters or naming collisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}:
    get:
      summary: Get Moul by Name
      description: Retrieves the schema metadata definition for a single registered collection.
      tags:
        - Moul Schema Management
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the collection schema to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: Collection schema metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moul'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Collection schema not found.
        '500':
          $ref: '#/components/responses/500InternalError'
    patch:
      summary: Update Moul
      description: |
        Updates an existing collection schema definition, rules, fields, and physical SQLite database table columns.
        If the `name` property in the request body is different from `{name}`, the physical table will be renamed.
      tags:
        - Moul Schema Management
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Current name of the collection to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: New or current name of the collection.
                type:
                  type: string
                  enum: [base, auth, worker, analytic]
                fields:
                  type: array
                  items:
                    $ref: '#/components/schemas/MoulField'
                rules:
                  $ref: '#/components/schemas/MoulRules'
                email_templates:
                  $ref: '#/components/schemas/EmailTemplates'
      responses:
        '200':
          description: Moul schema updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moul'
        '400':
          description: Invalid request parameters, empty name, or target name collision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          $ref: '#/components/responses/500InternalError'
    put:
      summary: Replace Moul
      description: |
        Replaces or updates an existing collection schema definition, rules, fields, and physical SQLite database table columns.
      tags:
        - Moul Schema Management
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Current name of the collection to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: New or current name of the collection.
                type:
                  type: string
                  enum: [base, auth, worker, analytic]
                fields:
                  type: array
                  items:
                    $ref: '#/components/schemas/MoulField'
                rules:
                  $ref: '#/components/schemas/MoulRules'
                email_templates:
                  $ref: '#/components/schemas/EmailTemplates'
      responses:
        '200':
          description: Moul schema updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moul'
        '400':
          description: Invalid request parameters, empty name, or target name collision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          $ref: '#/components/responses/500InternalError'
    delete:
      summary: Delete Moul
      description: Drops the physical SQLite table and removes its metadata record.
      tags:
        - Moul Schema Management
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the collection to delete.
          schema:
            type: string
      responses:
        '204':
          description: Moul deleted successfully.
        '400':
          description: Name parameter is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/email-templates:
    get:
      summary: Get Email Templates
      description: Retrieves custom email templates for an auth-type collection.
      tags:
        - Moul Schema Management
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      responses:
        '200':
          description: Email templates config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplates'
        '400':
          description: Collection is not an auth type.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Not found.
        '500':
          $ref: '#/components/responses/500InternalError'
    put:
      summary: Update Email Templates
      description: Updates custom email templates for an auth-type collection.
      tags:
        - Moul Schema Management
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTemplates'
      responses:
        '200':
          description: Templates updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplates'
        '400':
          description: Bad request.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Not found.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/email-templates/test:
    post:
      summary: Send Test Email
      description: Triggers a mock/test email using the specified template configuration and enqueues a SendEmail background job.
      tags:
        - Moul Schema Management
      security:
        - BearerAuth: []
        - AdminKeyAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Name of the auth collection.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - template
              properties:
                email:
                  type: string
                  format: email
                  description: Recipient email address.
                template:
                  type: string
                  enum: [verification, password_reset, confirm_email_change, otp, login_alert]
                  description: Key of the email template to test.
      responses:
        '200':
          description: Test email queued successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Test email sent/queued successfully (check server logs/console for details)
        '400':
          description: Invalid request parameters or not an auth moul.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          description: Not found.
        '500':
          $ref: '#/components/responses/500InternalError'

  /api/moul/{name}/webhooks:
    get:
      summary: List Collection Webhooks
