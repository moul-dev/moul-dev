# Air configuration for mould

root = "."
tmp_dir = "tmp/build"

[build]
  cmd = "go build -o ./tmp/build/main ./cmd/mould/main.go"
  bin = "./tmp/build/main"
  delay = 500
  include_dir = ["cmd", "internal", "pkg", "docs"]
  exclude_dir = ["bin", "tmp", ".git", ".gemini", ".agents", "website", "ui", "node_modules", "storage", "assets"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  include_ext = ["go", "toml"]
  kill_delay = "500ms"
  log = "build-errors.log"
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
